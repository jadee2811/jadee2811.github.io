 window.EBJ_USER=user;window.EBJ_K=K;try{sessionStorage.setItem("ebj.sauth",JSON.stringify({u:user,k:btoa(String.fromCharCode(...K))}))}catch(e){}if(document.readyState==="loading")await new Promise(r=>document.addEventListener("DOMContentLoaded",r));document.body.innerHTML="";document.open();document.write(html);document.close()}
async function tryLogin(user,pass){const base=await crypto.subtle.importKey("raw",enc.encode(user+"\0"+pass),"PBKDF2",false,["deriveKey"]);
 for(const u of B.users){try{const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(u.s),iterations:B.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const K=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:d(u.iv)},key,d(u.wk)));return K}catch(e){}}return null}
(async function(){try{const a=JSON.parse(localStorage.getItem("ebj.auth")||"null");if(a&&a.e>Date.now()){await openWith(d(a.k),a.u);return}const q=JSON.parse(sessionStorage.getItem("ebj.sauth")||"null");if(q){await openWith(d(q.k),q.u);return}}catch(e){localStorage.removeItem("ebj.auth")}
 document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("b"),er=document.getElementById("err");er.textContent="";b.disabled=true;b.textContent="Checking...";
  const user=document.getElementById("u").value.trim().toLowerCase(),pass=document.getElementById("p").value;
  const K=await tryLogin(user,pass);
  if(!K){er.textContent="Wrong name or password.";b.disabled=false;b.textContent="Enter";return}
  if(document.getElementById("r").checked)localStorage.setItem("ebj.auth",JSON.stringify({u:user,k:btoa(String.fromCharCode(...K)),e:Date.now()+7*864e5}));
  await openWith(K,user)}})();
</script></body></html>
