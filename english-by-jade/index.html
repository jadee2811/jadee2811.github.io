<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>English by Jade</title>
<meta name="description" content="Luyện nói tiếng Anh mỗi ngày: business, phỏng vấn, giao tiếp công sở.">
<meta name="theme-color" content="#141b3d">
<style>
:root{--bg:#141b3d;--bg2:#1d2750;--card:#222d5c;--ink:#f6efe0;--mut:#a9b3d6;--gold:#f2c14e;--rose:#e0485a;--g:#f2c14e;--red:#e0485a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);background-image:radial-gradient(#ffffff22 1px,transparent 1px);background-size:34px 34px}
main{max-width:520px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
h1{font-size:17px;margin:0;font-family:Georgia,serif;letter-spacing:.3px}.stats{display:flex;gap:10px;font-weight:700;font-size:15px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0004}
.hero{padding:0;overflow:hidden;position:relative}.hero img{display:block;width:100%;height:auto;aspect-ratio:1/1}
.hero .ov{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(transparent,#141b3dee)}
.lv{font-weight:800;font-size:20px;font-family:Georgia,serif}.bar{height:10px;background:#ffffff22;border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f2c14e,#f7e08c)}
button{font:inherit;border:0;border-radius:16px;padding:14px 18px;background:var(--gold);color:#2a2410;font-weight:800;width:100%;cursor:pointer;min-height:52px;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.98)}
button.sec{background:#ffffff1a;color:var(--ink)}button:disabled{opacity:.45}button.rec.on{background:var(--rose);color:#fff}
.chat{display:flex;flex-direction:column;gap:8px;max-height:38dvh;overflow:auto}
.b{padding:10px 14px;border-radius:16px;max-width:88%}.ai{background:#ffffff1a;align-self:flex-start}.me{background:var(--gold);color:#2a2410;align-self:flex-end}
textarea{width:100%;font-size:16px;border:1px solid #ffffff33;background:#141b3d;color:var(--ink);border-radius:14px;padding:10px;font-family:inherit;min-height:64px}
.tag{display:inline-block;font-size:12px;background:#ffffff1f;color:var(--gold);padding:2px 10px;border-radius:99px;font-weight:700}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px}.row>*{flex:1}
table{width:100%;border-collapse:collapse}td{padding:7px 0;border-bottom:1px solid #ffffff14}
.hidden{display:none}.quote{font-family:Georgia,serif;font-style:italic;color:var(--mut);text-align:center;font-size:14px}
#talk .row{position:sticky;bottom:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#0e1430f2;padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:9;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0}
nav a{flex:1;text-align:center;color:var(--mut);font-size:12px;font-weight:700;padding:4px 0;cursor:pointer}nav a.on{color:var(--gold)}
.path{position:relative;padding:8px 0 20px}.node{display:flex;align-items:center;margin:10px 0;gap:10px}
.dot{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:#ffffff1a;border:3px solid #ffffff33}
.dot.done{background:var(--gold);border-color:#f7e08c}.dot.now{background:var(--rose);border-color:#ff9aa6;animation:pulse 1.6s infinite}.dot.chest{border-radius:16px}
.lab{font-size:13px;color:var(--mut)}.lab b{color:var(--ink);display:block;font-size:14px}
@keyframes pulse{50%{box-shadow:0 0 0 10px #e0485a33}}@media(prefers-reduced-motion:reduce){.dot.now{animation:none}}
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 20% 10%,#2a2f6e55,transparent 55%),radial-gradient(ellipse at 85% 80%,#5a2d6a44,transparent 55%)}
#sky i{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--l)}
#sky i.g{background:#ffe08a;box-shadow:0 0 8px 2px #ffe08a99}
#sky i.s{width:2px!important;height:2px!important;background:linear-gradient(90deg,#fff,transparent);border-radius:2px;width:90px!important;opacity:0;animation:shoot 7s linear infinite;animation-delay:var(--l)}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(25deg)}3%{opacity:1}12%{opacity:0;transform:translate(260px,120px) rotate(25deg)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){#sky i{animation:none;opacity:.7}}
main,nav,header{position:relative;z-index:1}nav{position:fixed}header{position:sticky}
.ic{vertical-align:-5px;flex:none}nav a .ic{display:block;margin:0 auto 2px}.stats span{display:flex;align-items:center;gap:4px}.dot .ic{width:34px;height:34px}.musicbtn{position:fixed;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:10;width:46px;height:46px;border-radius:50%;padding:0;background:#0e1430e6;border:2px solid #f2c14e55;display:flex;align-items:center;justify-content:center;min-height:0;width:46px}.musicbtn.off{opacity:.55}.musicbtn.off::after{content:'';position:absolute;width:28px;height:3px;background:#e0485a;transform:rotate(-45deg);border-radius:2px}

.pathbox{position:relative;margin:6px 0;width:100%}.route{position:absolute;inset:0;width:100%;height:100%}
.pn{position:absolute;transform:translate(-50%,-50%);width:200px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pw{position:relative;width:64px;height:64px}.pn.rosen .pw{width:96px;height:96px}
.pl.lock{filter:grayscale(.9) brightness(.72);}.pl.now{filter:drop-shadow(0 0 12px #f2c14ecc);animation:pulse2 2s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.1)}}@media(prefers-reduced-motion:reduce){.pl.now{animation:none}}
.bdg{position:absolute;right:-6px;bottom:-2px;width:24px;height:24px;background:var(--gold);border-radius:50%;padding:4px}.bdg.lk{background:#2b3566}
.pn .lab{margin-top:4px;font-size:12px;line-height:1.25}.pn .lab b{font-size:13px}
.pn.lock .lab{opacity:.55}
.phase{border-top:1px dashed #ffffff33;margin-top:14px;padding-top:14px}.lockline{display:flex;gap:8px;justify-content:center;align-items:center;font-weight:800;color:var(--mut);margin-bottom:4px}.lps{display:flex;justify-content:center;gap:10px;margin-top:10px}.lp{opacity:.9}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd35c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>

<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="url(#gS)" stroke="#e8a52a" stroke-width=".6" stroke-linejoin="round"/></symbol>
<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2C9 7 5 10.500 5 15a7 7 0 0 0 14 0c0-4.500-4-8-7-13z" fill="url(#gW)"/><path d="M9 15a3 3 0 0 0 2.500 3" stroke="#fff" stroke-width="1.400" fill="none" stroke-linecap="round" opacity=".7"/></symbol>
<symbol id="i-rose" viewBox="0 0 24 24"><path d="M12 14v8M12 18c-3 0-5-1-6-3 3 0 5 1 6 3zM12 19c3 0 5-1 6-3-3 0-5 1-6 3z" stroke="#4f9a5b" stroke-width="1.500" fill="#6fbf73" stroke-linecap="round"/><circle cx="12" cy="9" r="6.500" fill="url(#gH)"/><path d="M12 5.500c3 0 4 3 2 4.500s-4 0-3-2 3-1.500 3-.5M8.500 9c0 3 3 5 6 3" stroke="#a82442" stroke-width="1.100" fill="none" stroke-linecap="round"/></symbol>
<symbol id="i-planet" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="11" ry="3.600" fill="none" stroke="#e8c37a" stroke-width="1.500" transform="rotate(-20 12 12)"/><circle cx="12" cy="12" r="6.500" fill="url(#gP)"/><circle cx="10" cy="10" r="1.500" fill="#8c5535" opacity=".6"/><circle cx="14.500" cy="14" r="1" fill="#8c5535" opacity=".6"/><path d="M1.500 14c4 3 17 .5 21-3" stroke="#e8c37a" stroke-width="1.500" fill="none" stroke-linecap="round" transform="rotate(0)"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="1.500" fill="#8fd3a8"/><rect x="10" y="7" width="4" height="14" rx="1.500" fill="#f2c14e"/><rect x="17" y="3" width="4" height="18" rx="1.500" fill="#ff8a9a"/></symbol>
<symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="#f6efe0"/><g fill="#d63553"><circle cx="8" cy="8" r="1.700"/><circle cx="16" cy="8" r="1.700"/><circle cx="12" cy="12" r="1.700"/><circle cx="8" cy="16" r="1.700"/><circle cx="16" cy="16" r="1.700"/></g></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" stroke="#f2c14e" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="6.500" cy="18" r="3" fill="#f2c14e"/><circle cx="17.500" cy="16" r="3" fill="#f2c14e"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3" fill="#8590bd"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#8590bd" stroke-width="2.200" fill="none"/><circle cx="12" cy="15.500" r="1.600" fill="#141b3d"/></symbol>
<symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="#ff8a9a"/><rect x="2" y="6" width="20" height="5" rx="1.500" fill="#ffb3be"/><rect x="10.500" y="6" width="3" height="15" fill="#f2c14e"/><path d="M12 6C9 1 5 3 8 6zM12 6c3-5 7-3 4 0z" fill="#f2c14e"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7" stroke="#2a2410" stroke-width="3.200" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<div id="sky"></div>
<main>
<header><h1>✦ English by Jade</h1><div class="stats"><span><svg class="ic" width="22" height="22"><use href="#i-flame"/></svg><em id="streak" style="font-style:normal">0</em></span><span><svg class="ic" width="22" height="22"><use href="#i-heart"/></svg><em id="hearts" style="font-style:normal">5</em></span><span><svg class="ic" width="22" height="22"><use href="#i-star"/></svg><em id="xp" style="font-style:normal">0</em></span></div></header>

<section id="home">
  <div class="card hero"><img id="heroImg" src="img/bud.webp" width="720" height="720" alt="Hoàng tử bé và bông hồng">
    <div class="ov"><div class="lv" id="lv">Lv.1</div><div class="bar"><i id="treeBar" style="width:0"></i></div>
    <div class="mut" id="treeSub"></div></div></div>
  <div class="quote" id="treeMsg"></div>
  <div class="card"><span class="tag" id="todayTrack"></span>
    <h2 style="margin:8px 0 4px;font-family:Georgia,serif" id="todayTitle"></h2><div class="mut" id="todayDesc"></div>
    <p></p><div class="row" style="margin-bottom:8px"><button class="sec" id="rnd"><svg class="ic"><use href="#i-dice"/></svg> Đổi bài ngẫu nhiên</button></div><button id="start">Bắt đầu cuộc hội thoại hôm nay</button>
    <p class="mut" style="margin-bottom:0">Mỗi bài học xong là một ca nước tưới bông hồng. Nước là nội dung chị đã nói.</p></div>
</section>

<section id="journey" class="hidden">
  <div class="card"><b>Hành trình 30 ngày</b> <span class="mut" id="jSub"></span><div class="path" id="path"></div></div>
</section>

<section id="stats" class="hidden">
  <div class="card"><b>Tuần này</b> <span class="mut" id="weekTotal"></span><table id="weekTbl"></table>
    <div class="mut" id="best"></div></div>
  <div class="card"><b>Nước đã tưới (nội dung đã học)</b><div class="mut" id="learned">Chưa có</div></div>
</section>

<section id="talk" class="hidden">
  <div class="card"><span class="tag" id="tTrack"></span> <b id="tTitle"></b>
    <div class="mut" id="tProg"></div></div>
  <div class="card chat" id="chat"></div>
  <div class="card">
    <textarea id="ans" placeholder="Nói bằng micro hoặc gõ câu trả lời tiếng Anh (cố gắng 2-4 câu)"></textarea>
    <div class="row" style="margin-top:8px"><button class="rec" id="mic">Nói</button><button id="send">Gửi</button></div>
    <div class="mut" id="micHint"></div>
  </div>
  <button class="sec" id="quit">Thoát (mất 1 tim)</button>
</section>

<section id="done" class="hidden">
  <div class="card" style="text-align:center"><div><svg class="ic" width="56" height="56"><use href="#i-drop"/></svg><svg class="ic" width="56" height="56"><use href="#i-rose"/></svg></div><h2 id="dTitle" style="font-family:Georgia,serif"></h2><div id="dBody" style="text-align:left"></div></div>
  <button id="back">Về với bông hồng</button>
</section>
</main>
<button class="musicbtn" id="music" aria-label="Nhạc nền"><svg class="ic" width="24" height="24"><use href="#i-note"/></svg></button>
<nav id="nav"><a data-t="home" class="on"><svg class="ic" width="28" height="28"><use href="#i-rose"/></svg>Bông hồng</a><a data-t="journey"><svg class="ic" width="28" height="28"><use href="#i-planet"/></svg>Hành trình</a><a data-t="stats"><svg class="ic" width="28" height="28"><use href="#i-chart"/></svg>Tiến bộ</a></nav>

<script>
const TRACKS={
 biz:{name:"Business",items:[
  {t:"Pitch 60 giây cho khách",who:"a skeptical CTO",d:"Giới thiệu giải pháp AI cho khách enterprise.",
   learn:["problem → solution → proof → ask","Let me start with the problem we saw"],
   q:["Thanks for coming. In one minute, what problem do you solve and for whom?","Interesting. Why would we choose you over building it ourselves?","What evidence do you have that it works? Give me one real number.","What is the biggest risk if we start next month?","Okay. What exactly do you want from me today?"]},
  {t:"Đàm phán scope",who:"a client who wants more for less",d:"Giữ scope, không mất quan hệ.",
   learn:["Here's what I can do within the timeline","Let's park that for phase two"],
   q:["We need three extra features, but the deadline stays the same. Is that possible?","Your competitor said they can do it for the same price. What do you say?","I don't have budget for phase two. How can we still move forward?","If we cut one feature, which one would you cut and why?","Summarize what we agreed in two sentences."]},
  {t:"Báo tin xấu về tiến độ",who:"your director",d:"Dự án trễ, trình bày rõ và có phương án.",
   learn:["Heads-up: we're two weeks behind","Here are two options and my recommendation"],
   q:["I heard there is a delay. What happened?","What is the impact on the customer?","What options do you see?","Which one do you recommend and why?","What do you need from me to make it work?"]}]},
 job:{name:"Phỏng vấn",items:[
  {t:"Tự giới thiệu và thành tích",who:"a hiring manager at a global tech company",d:"Kể thành tích bằng STAR, có số liệu.",
   learn:["Situation, Task, Action, Result","I led / I drove / I shipped"],
   q:["Tell me about yourself in under two minutes.","What is the achievement you're most proud of in product management?","What exactly was your role, and what did you personally do?","What was the measurable result?","What would you do differently?"]},
  {t:"Câu hỏi hành vi",who:"a senior interviewer at Google",d:"Mâu thuẫn, ưu tiên, ra quyết định khi thiếu dữ liệu.",
   learn:["The trade-off was...","I aligned the stakeholders by..."],
   q:["Tell me about a time you disagreed with a stakeholder. What happened?","How do you prioritize when everything is urgent?","Describe a decision you made with incomplete data.","Tell me about a product that failed. What did you learn?","Why do you want to work here?"]},
  {t:"Thương lượng lương",who:"an HR partner",d:"Nói con số tự tin và lịch sự.",
   learn:["Based on my scope and impact...","I'm flexible on structure, but..."],
   q:["We would like to offer you the role. What are your salary expectations?","That is above our band. How flexible are you?","What matters most to you besides the base salary?","Can you tell me your timeline for deciding?","Great. Is there anything else you'd like to clarify?"]}]},
 daily:{name:"Giao tiếp công sở",items:[
  {t:"Small talk và standup",who:"a new teammate from Singapore",d:"Chào hỏi tự nhiên, báo cáo ngắn gọn.",
   learn:["Quick update from my side","I'm blocked on..."],
   q:["Hi! I'm new here. How long have you been on the team?","How was your weekend?","Okay, standup time. What did you do yesterday?","What are you working on today, and are you blocked on anything?","We're going to lunch. Want to join? Tell me about the food you like."]},
  {t:"Góp ý và từ chối lịch sự",who:"a colleague who needs your help",d:"Nói không mà không mất lòng.",
   learn:["I'd love to, but my plate is full","Can I offer an alternative?"],
   q:["Hey, could you review my deck today? It's urgent.","I know you are busy, but it would really help. Can you do it?","Okay, when would be a good time for you?","By the way, can I give you some feedback on your last presentation?","Thanks for listening. Anything you want to ask me?"]},
  {t:"Networking ở sự kiện",who:"an engineer you just met at a conference",d:"Giới thiệu bản thân và tạo kết nối.",
   learn:["What brings you here?","Let's keep in touch"],
   q:["Hi, I'm Alex. What do you do?","What are you working on at the moment?","That's interesting. What is the hardest part of your work?","Have you used AI in your product team?","Nice talking to you. How can we stay in touch?"]}]}
};
const ORDER=["biz","job","daily"];
const KEY="ebj.v1";
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dayNum=s=>Math.floor(Date.parse(s)/864e5);
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{xp:0,streak:0,best:0,last:null,hearts:5,heartsDay:null,log:{},learned:[],sessions:0,weekBest:0};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=id=>document.getElementById(id);

function rollDay(){
  const t=today();
  if(S.heartsDay!==t){S.hearts=5;S.heartsDay=t}
  if(S.last){const gap=dayNum(t)-dayNum(S.last);if(gap>1){S.streak=0}if(gap>=5&&(S.chain||0)>0){S.chain=0;S.dead=true}}
  save();
}
let override=null;
function pickToday(){if(override)return override;
  const n=dayNum(today());const tr=ORDER[n%3];const items=TRACKS[tr].items;
  return {tr,it:items[Math.floor(n/3)%items.length]};
}
const STAGES=[[0,"🌱","Hạt mầm"],[30,"🌿","Mầm non"],[90,"🪴","Cây con"],[200,"🌷","Nụ hoa"],[400,"🌹","Hoa hồng nở"]];
function stage(){let s=STAGES[0],nx=null;for(let i=0;i<STAGES.length;i++){if(S.xp>=STAGES[i][0]){s=STAGES[i];nx=STAGES[i+1]||null}}return {s,nx}}
function wiltLevel(){if(S.dead)return 3;if(!S.last)return 0;const g=dayNum(today())-dayNum(S.last);return g<=1?0:g==2?1:g<=4?2:3}
function weekKey(t){const d=new Date(t);const day=(d.getUTCDay()+6)%7;return new Date(d-day*864e5).toISOString().slice(0,10)}


const PNAMES=["Hành tinh của Nhà vua","Hành tinh Người hợm hĩnh","Hành tinh Kẻ say rượu","Hành tinh Doanh nhân","Hành tinh Người thắp đèn","Hành tinh Nhà địa lý","Hành tinh Sa mạc cáo","Hành tinh Gió sao","Hành tinh Mưa sao băng","Hành tinh Ngàn sao","Hành tinh Mặt trăng nhỏ","Hành tinh Cầu vồng","Hành tinh Vòng nhẫn bạc","Hành tinh Biển sương","Hành tinh Núi lửa ngủ","Hành tinh Rừng baobab","Hành tinh Bình minh","Hành tinh Hoàng hôn","Hành tinh Đom đóm","Hành tinh Giếng nước","Hành tinh Đồng cỏ","Hành tinh Tuyết tím","Hành tinh Vàng mật","Hành tinh Lá thư","Hành tinh Tiếng cười","Hành tinh Con cừu","Hành tinh Ngọn đèn","Hành tinh Chiếc khăn xanh","Hành tinh Lời hứa"];
function planetSVG(i,st){
  const h=(i*47+20)%360,h2=(h+40)%360,id="pl"+i+st,f=i%6;
  let extra="";
  if(f==0)extra=`<ellipse cx="32" cy="34" rx="29" ry="8" fill="none" stroke="hsl(${h2} 70% 80%)" stroke-width="3" transform="rotate(-18 32 34)"/>`;
  if(f==1)extra=`<g clip-path="url(#c${id})"><rect x="0" y="22" width="64" height="5" fill="hsl(${h2} 60% 70%)" opacity=".6"/><rect x="0" y="34" width="64" height="7" fill="hsl(${h2} 60% 40%)" opacity=".5"/></g>`;
  if(f==2)extra=`<circle cx="22" cy="26" r="5" fill="#0003"/><circle cx="40" cy="38" r="7" fill="#0003"/><circle cx="26" cy="42" r="3" fill="#0003"/>`;
  if(f==3)extra=`<g clip-path="url(#c${id})"><ellipse cx="32" cy="8" rx="16" ry="8" fill="#fff" opacity=".85"/></g><circle cx="46" cy="40" r="4" fill="#ffffff55"/>`;
  if(f==4)extra=`<circle cx="54" cy="12" r="5" fill="hsl(${h2} 30% 85%)"/><circle cx="24" cy="30" r="4" fill="hsl(${h2} 70% 70%)" opacity=".7"/><circle cx="38" cy="42" r="5" fill="hsl(${h2} 70% 70%)" opacity=".7"/>`;
  if(f==5)extra=`<path d="M10 40c10 8 30 8 44-2" stroke="hsl(${h2} 70% 80%)" stroke-width="3" fill="none" opacity=".7"/><circle cx="26" cy="24" r="2.500" fill="#fff" opacity=".7"/><circle cx="40" cy="28" r="2" fill="#fff" opacity=".7"/>`;
  const ring=f==0?`<path d="M3 36c14 9 44 3 58-8" stroke="hsl(${h2} 70% 80%)" stroke-width="3" fill="none"/>`:"";
  return `<svg viewBox="0 0 64 64" width="64" height="64" class="pl ${st}"><defs><radialGradient id="g${id}" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="hsl(${h} 80% 78%)"/><stop offset=".6" stop-color="hsl(${h} 60% 50%)"/><stop offset="1" stop-color="hsl(${h} 55% 28%)"/></radialGradient><clipPath id="c${id}"><circle cx="32" cy="32" r="22"/></clipPath></defs>${f==0?'':''}<circle cx="32" cy="32" r="22" fill="url(#g${id})"/>${extra}${ring}<ellipse cx="24" cy="22" rx="7" ry="4" fill="#fff" opacity=".28" transform="rotate(-30 24 22)"/></svg>`}
function roseSVG(st){return `<svg viewBox="0 0 96 96" width="96" height="96" class="pl ${st}"><defs><radialGradient id="rg${st}" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#f6c28b"/><stop offset="1" stop-color="#9a5e3b"/></radialGradient></defs><circle cx="48" cy="66" r="26" fill="url(#rg${st})"/><circle cx="36" cy="72" r="4" fill="#0003"/><circle cx="60" cy="76" r="3" fill="#0003"/><path d="M26 44a22 24 0 0 1 44 0v18H26z" fill="#cfe9f5" opacity=".35" stroke="#e8f6ff" stroke-width="1.5"/><circle cx="48" cy="20" r="3" fill="#e8f6ff"/><path d="M48 62V46" stroke="#4f9a5b" stroke-width="2.500"/><path d="M48 56c-6 0-9-2-10-5 5 0 9 2 10 5zM48 54c6 0 9-2 10-5-5 0-9 2-10 5z" fill="#6fbf73"/><circle cx="48" cy="40" r="9" fill="#e0485a"/><path d="M48 33c5 0 6 5 3 7s-6 0-5-3 4-2 4-1M41 40c0 5 5 8 9 5" stroke="#8e1d36" stroke-width="1.300" fill="none" stroke-linecap="round"/></svg>`}
function journeyHTML(ph,inPh,done){
  const H=124,N=30,tot=N*H+170;let nodes="",pts=[];
  const cur=done&&inPh>0?inPh-1:inPh;
  for(let i=0;i<=N;i++){const x=50+Math.sin(i*0.95)*30,y=40+i*H;pts.push([x,y]);
    const rose=i==N,st=(!rose&&i<inPh)?"done":(i==cur&&!(done&&inPh==0&&false))?"now":"lock";
    const state=rose?(inPh>=30?"done":cur==N?"now":"lock"):st;
    const label=rose?"Gặp bông hồng":PNAMES[i%PNAMES.length];
    const track=rose?"Hoàng tử bé chờ chị ở cuối hành trình":"Ngày "+(ph*30+i+1)+" · "+TRACKS[ORDER[(ph*30+i)%3]].name;
    nodes+=`<div class="pn ${state}${rose?" rosen":""}" style="left:${x}%;top:${y}px"><div class="pw">${rose?roseSVG(state):planetSVG(i,state)}${state=="done"?'<svg class="bdg"><use href="#i-check"/></svg>':state=="lock"?'<svg class="bdg lk"><use href="#i-lock"/></svg>':""}</div><div class="lab"><b>${label}</b>${track}</div></div>`}
  let d="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1]).join(" L");
  return `<div class="pathbox" style="height:${tot}px"><svg class="route" viewBox="0 0 100 ${tot}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#f2c14e55" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>${nodes}</div>`}
function lockedHTML(n){let g="";for(let i=0;i<4;i++)g+=`<div class="lp">${planetSVG(i+7,"lock")}</div>`;return `<div class="phase"><div class="lockline"><svg class="ic" width="22" height="22"><use href="#i-lock"/></svg> Chặng ${n} · đang khoá</div><div class="mut" style="text-align:center">Mở ra sau khi chị gặp bông hồng ở ngày 30. Mỗi chặng 30 ngày là một hành trình mới.</div><div class="lps">${g}</div></div>`}
function lvl(){return Math.floor(S.xp/40)+1}
function render(){
  rollDay();
  $("streak").textContent=S.streak;$("hearts").textContent=S.hearts;$("xp").textContent=S.xp;
  const w=wiltLevel();const ch=S.chain||0;const stg=ch>=14?2:ch>=7?1:0;
  const img=w>=2?"wilt":["bud","grow","bloom"][stg];
  $("heroImg").src="img/"+img+".webp";$("heroImg").style.filter=w==1?"saturate(.6) brightness(.85)":"";
  const SN=["Nảy mầm","Nụ hoa","Nở hoa"];
  $("lv").textContent="Lv."+lvl()+" · "+(S.dead?"Bông hồng đã lụi":w>=2?SN[stg]+" (đang héo)":w==1?SN[stg]+" (hơi héo)":SN[stg]);
  $("treeBar").style.width=(S.xp%40)/40*100+"%";
  $("treeSub").textContent=S.dead?"Bắt đầu lại từ ngày 1 · ":(stg<2?`${(stg?14:7)-ch} ngày nữa thành ${SN[stg+1].toLowerCase()} · `:"")+(40-S.xp%40)+" XP nữa lên Lv."+(lvl()+1);
  const done=S.last===today();
  $("treeMsg").textContent=S.dead?"Bông hồng lụi vì bỏ quá 3 ngày. Hoàng tử bé gieo lại hạt, mình học lại từ đầu nha.":done?"“Chính thời gian em đã dành cho bông hồng làm nó quan trọng.” Hôm nay chị đã tưới rồi.":w==0?"Bông hồng đang đợi chị tưới nước tối nay":w==1?"Bỏ 1 ngày rồi, bông hồng hơi héo. Tưới ngay nha":"Bông hồng sắp lụi, học 1 bài để cứu nó (quá 3 ngày là phải học lại từ đầu)";
  const {tr,it}=pickToday();
  $("todayTrack").textContent=TRACKS[tr].name;$("todayTitle").textContent=it.t;$("todayDesc").textContent="Với "+it.who+". "+it.d;
  $("start").textContent=done?"Học thêm 1 vòng (tính XP)":"Bắt đầu cuộc hội thoại hôm nay";
  $("start").disabled=S.hearts<=0;if(S.hearts<=0)$("start").textContent="Hết tim, mai quay lại nha";
  // journey
  const days=S.chain||0;const ph=Math.floor(days/30),inPh=days%30;
  const cur=done&&inPh>0?inPh-1:inPh;
  $("jSub").textContent=`· Chặng ${ph+1} · ${inPh}/30 ngày`+(ph?` · đã gặp bông hồng ${ph} lần`:"");
  $("path").innerHTML=journeyHTML(ph,inPh,done)+lockedHTML(ph+2);
  const wk=weekKey(today());let tot=0,rows="";
  for(let i=0;i<7;i++){const d=new Date(Date.parse(wk)+i*864e5).toISOString().slice(0,10);const v=S.log[d]||0;tot+=v;rows+=`<tr><td>${["T2","T3","T4","T5","T6","T7","CN"][i]}</td><td>${v?v+" XP":"–"}</td></tr>`}
  $("weekTbl").innerHTML=rows;$("weekTotal").textContent=`· ${tot} XP`;
  S.weekBest=Math.max(S.weekBest||0,tot);save();
  $("best").textContent=`Kỷ lục tuần: ${S.weekBest} XP · streak dài nhất: ${S.best} ngày`;
  $("learned").innerHTML=S.learned.length?S.learned.slice(-8).reverse().map(x=>"• "+x).join("<br>"):"Chưa có, học bài đầu tiên nha";
}

let cur=null,idx=0,mins=0,words=0,weak=0,fillers=0,t0=0;
function addMsg(c,t){const d=document.createElement("div");d.className="b "+c;d.textContent=t;$("chat").appendChild(d);$("chat").scrollTop=1e9}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function ask(){addMsg("ai",cur.it.q[idx]);speak(cur.it.q[idx]);$("tProg").textContent=`Câu ${idx+1}/${cur.it.q.length} · đang nói chuyện với ${cur.it.who}`;t0=Date.now()}
function show(id){for(const x of["home","journey","stats","talk","done"])$(x).classList.toggle("hidden",x!==id);$("nav").style.display=(id=="talk")?"none":"flex";document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.t===id));window.scrollTo(0,0)}
document.querySelectorAll("#nav a").forEach(a=>a.onclick=()=>{render();show(a.dataset.t)});

$("start").onclick=()=>{cur=pickToday();idx=0;words=0;weak=0;fillers=0;$("chat").innerHTML="";$("tTrack").textContent=TRACKS[cur.tr].name;$("tTitle").textContent=cur.it.t;show("talk");
  addMsg("ai","Mẹo: "+cur.it.learn.join(" · "));ask()};
$("send").onclick=()=>{
  const a=$("ans").value.trim();if(!a)return;speechSynthesis&&speechSynthesis.cancel();
  addMsg("me",a);$("ans").value="";
  const w=(a.match(/[A-Za-z']+/g)||[]).length;words+=w;
  const f=(a.toLowerCase().match(/\b(um+|uh+|er|like|you know|actually)\b/g)||[]).length;fillers+=f;
  if(w<8){weak++;S.hearts=Math.max(0,S.hearts-1);addMsg("ai","Hơi ngắn, thử nói 2-3 câu nhé (-1 tim). Tôi hỏi tiếp.");save();$("hearts").textContent=S.hearts;if(S.hearts<=0){finish(true);return}}
  idx++;if(idx>=cur.it.q.length){finish(false)}else setTimeout(ask,600)
};
$("quit").onclick=()=>{S.hearts=Math.max(0,S.hearts-1);save();show("home");render()};
function finish(out){
  const t=today();const full=!out;
  let xp=Math.min(60,Math.round(words/4))+(full?20:0)-weak*2;xp=Math.max(5,xp);
  const gap=S.last?dayNum(t)-dayNum(S.last):9;
  if(S.last!==t){S.streak=(gap===1)?S.streak+1:1}
  S.best=Math.max(S.best,S.streak);if(S.last!==t)S.chain=(S.chain||0)+1;S.dead=false;S.last=t;S.xp+=xp;S.log[t]=(S.log[t]||0)+xp;S.sessions++;
  if(full)for(const l of cur.it.learn)if(!S.learned.includes(l))S.learned.push(l);
  save();
  const avg=Math.round(words/cur.it.q.length);
  $("dTitle").textContent=full?`+${xp} XP · bông hồng được tưới nước`:`Hết tim, +${xp} XP`;
  $("dBody").innerHTML=`<p>Trung bình <b>${avg}</b> từ/câu (mục tiêu 20+). Từ đệm (um, like...): <b>${fillers}</b>. Câu quá ngắn: <b>${weak}</b>.</p>
  <p class="mut">Câu nên thuộc hôm nay: ${cur.it.learn.map(x=>"<br>• "+x).join("")}</p>
  <p class="mut">Streak: ${S.streak} ngày. Mai quay lại để cây không rũ.</p>`;
  show("done")
}
$("back").onclick=()=>{show("home");render()};

// microphone
$("rnd").onclick=()=>{const all=[];for(const tr of ORDER)for(const it of TRACKS[tr].items)all.push({tr,it});const c=pickToday();let n;do{n=all[Math.floor(Math.random()*all.length)]}while(n.it===c.it);override=n;render()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,on=false;
if(!SR){$("mic").disabled=true;$("micHint").textContent="Trình duyệt này chưa hỗ trợ nói thành chữ: chị mở bằng Chrome (Android) hoặc Safari mới, hoặc gõ tạm."}
else{$("micHint").textContent="Bấm Nói, nói tiếng Anh, bấm lần nữa để dừng rồi Gửi.";
 $("mic").onclick=()=>{
  if(on){rec.stop();return}
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;let base=$("ans").value;
  rec.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;$("ans").value=(base?base+" ":"")+t};
  rec.onend=()=>{on=false;$("mic").classList.remove("on");$("mic").textContent="Nói"};
  speechSynthesis.cancel();rec.start();on=true;$("mic").classList.add("on");$("mic").textContent="Dừng"}}
(function(){const k=$("sky");let h="";const n=innerWidth>700?150:80;
for(let i=0;i<n;i++){const z=Math.random()<.12?"g":"";const sz=z?3+Math.random()*3:1+Math.random()*2.2;
h+=`<i class="${z}" style="left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--d:${2+Math.random()*4}s;--l:-${Math.random()*6}s"></i>`}
for(let i=0;i<3;i++)h+=`<i class="s" style="left:${Math.random()*60}%;top:${Math.random()*40}%;--l:${i*2.6}s"></i>`;
k.innerHTML=h})();
// background music: soft generative lullaby (WebAudio)
let AC=null,musicOn=localStorage.getItem("ebj.music")!=="0",tmr=null;
const NOTES=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
function tone(f,t,d,v,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function loop(){if(!musicOn||!AC)return;const t=AC.currentTime+.05;const chords=[[0,2,4],[3,5,7],[1,4,6],[0,3,5]];const ch=chords[Math.floor(Math.random()*4)];
 ch.forEach(i=>tone(NOTES[i]/2,t,4.2,.035,"sine"));
 for(let k=0;k<8;k++){const n=NOTES[ch[Math.floor(Math.random()*3)]+(Math.random()<.4?0:0)]*(Math.random()<.5?1:2);if(Math.random()<.8)tone(n,t+k*.55,1.6,.03,"triangle")}
 tmr=setTimeout(loop,4400)}
function musicStart(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();clearTimeout(tmr);loop()}
function musicBtn(){$("music").classList.toggle("off",!musicOn)}
$("music").onclick=()=>{musicOn=!musicOn;localStorage.setItem("ebj.music",musicOn?"1":"0");musicBtn();if(musicOn)musicStart();else{clearTimeout(tmr)}};
musicBtn();
addEventListener("pointerdown",function f(){removeEventListener("pointerdown",f);if(musicOn)musicStart()},{once:true});
render();
</script>
</body>
