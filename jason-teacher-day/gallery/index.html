<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><base href="/jason-teacher-day/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tường thiệp 20/11 · Cáo Ú</title>
<meta property="og:title" content="Tường thiệp 20/11, mọi người chúc nhau">
<meta property="og:image" content="https://jadeshare.space/jason-teacher-day/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&family=Charm:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2d4a73;--soft:#6b7f9e;--bl:#3a5fa0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#faf6ea url(paper.jpg);color:#2b3447;font-weight:500}
.back{position:fixed;top:14px;left:14px;z-index:20;width:40px;height:40px;border-radius:999px;border:1.5px solid #b9c6dc;background:#fffdf7;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px #2d4a7322}
.cta{position:fixed;top:14px;right:14px;z-index:20;background:var(--bl);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:11px 18px;font-size:14px;box-shadow:0 4px 14px #2d4a7333}
.board{position:fixed;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:clamp(10px,2vw,28px);padding:clamp(64px,9vh,84px) clamp(16px,4vw,64px) clamp(16px,4vh,40px)}
.note{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:0 10px}
.note h1{font-family:'Charm',cursive;font-size:clamp(28px,3.6vw,48px);margin:0 0 8px;color:var(--ink);line-height:1.1}
.note p{font-family:'Charm',cursive;font-size:clamp(18px,2vw,26px);margin:0;color:#3d5680;line-height:1.35}
.c{position:relative;display:flex;flex-direction:column;min-height:0;text-decoration:none;color:inherit;border-radius:6px;padding:clamp(12px,1.6vw,20px) clamp(12px,1.4vw,18px) 10px;box-shadow:0 12px 26px #2d4a7338,0 0 0 1px #0001;transition:transform .25s;overflow:hidden}
.c:hover{transform:scale(1.04) rotate(0deg)!important;z-index:5}
.c:before{content:"";position:absolute;inset:6px;border:1.5px solid currentColor;opacity:.3;border-radius:3px;pointer-events:none}
.pin{position:absolute;top:-6px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,#d63a2a 60%,#9c2519);box-shadow:0 3px 5px #0005;z-index:3}
.c .to{font-family:'Charm',cursive;font-weight:700;font-size:clamp(18px,2.1vw,28px);text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c img{display:block;height:34%;aspect-ratio:1;margin:4px auto;border-radius:50%;object-fit:cover;-webkit-mask-image:radial-gradient(circle,#000 56%,transparent 71%);mask-image:radial-gradient(circle,#000 56%,transparent 71%);flex:none}
.c p{font-family:'Charm',cursive;font-size:clamp(14px,1.45vw,19px);line-height:1.3;text-align:center;margin:0 2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.c .f{margin-top:auto;font-family:'Charm',cursive;font-weight:700;font-size:clamp(14px,1.5vw,19px);text-align:right;padding-top:4px}
.c .s{margin-top:auto;font-size:10.5px;opacity:.6;text-align:right;padding-top:4px}
.env{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:18px}
.env h1{font-family:'Charm',cursive;font-size:clamp(30px,5vw,48px);margin:0;color:var(--ink);line-height:1.1}
.env p{font-family:'Charm',cursive;font-size:clamp(19px,2.4vw,26px);margin:0;color:#3d5680}
.envl{width:min(300px,76vw);filter:drop-shadow(0 14px 18px #2d4a7326);animation:ef 4s ease-in-out infinite}.envl img{width:100%;display:block}
@keyframes ef{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:760px){.board{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:12px;padding:64px 14px 14px}.note{grid-column:1/3}.c p{-webkit-line-clamp:3}.c img{height:30%}.cta{padding:9px 14px;font-size:13px}}
</style></head><body>
<a class="back" href="/jason-teacher-day/" aria-label="Quay lại tạo thiệp"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
<a class="cta" href="/jason-teacher-day/">Gửi một tấm thiệp ♥&#xFE0E;</a>
<main class="board" id="b"></main>
<script>
const FR=[{sw:'#f7f2e5',ink:'#2d4a73'},{sw:'#bcd0ee',ink:'#1f3f77'},{sw:'#f6cdb2',ink:'#7a4527'},{sw:'#27467f',ink:'#f4ecd8'}];
const ART=['butmay','caydai','denban','denbien','doday','lanban'];
const SAMPLE=[
 {t:'cô Hà',m:'Cô đã dạy em từng nét chữ đầu tiên. Cảm ơn cô rất nhiều ạ.',f:'học trò của cô',a:'butmay',k:0},
 {t:'sếp Nam',m:'Cảm ơn sếp đã tin tưởng giao việc và kiên nhẫn chỉ cho em từng bước.',f:'Linh',a:'caydai',k:2},
 {t:'chị Mai',m:'Có những hôm mệt, nghĩ đến lời chị dặn là em thấy vững lại.',f:'em út',a:'denban',k:1},
 {t:'thầy Tuấn',m:'Thầy không dắt tay, chỉ chỉ hướng thôi, vậy mà em đi được xa.',f:'Minh',a:'lanban',k:3},
 {t:'cô Thu',m:'Chúc cô ngày 20/11 thật vui, nhiều sức khoẻ và luôn tràn đầy năng lượng.',f:'lớp 12A',a:'doday',k:0},
 {t:'anh Đức',m:'Cảm ơn anh đã soi đường mỗi lúc em lạc hướng.',f:'Trang',a:'denbien',k:1}
];
const e=t=>String(t==null?'':t).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
const rot=i=>[-3.2,2.4,-1.8,3.1,-2.6,1.6,-3.6,2.8][i%8];
function card(x,i,sample){const f=FR[Math.min(3,Math.max(0,+x.k||0))],a=ART.includes(x.a)?x.a:'doday';
 const tag=sample?'div':'a';
 return '<'+tag+' class="c" '+(sample?'':'href="/jason-teacher-day/?s='+e(x.id)+'"')+' style="background:'+f.sw+';color:'+f.ink+';transform:rotate('+rot(i)+'deg)"><i class="pin"></i><div class="to">'+e(x.t)+'</div><img src="art/'+a+'.jpg" alt="" loading="lazy"><p>'+e(x.m)+'</p>'+(sample?'<div class="s">thiệp mẫu · '+e(x.f)+'</div>':(x.f?'<div class="f">— '+e(x.f)+'</div>':''))+'</'+tag+'>'}
async function load(){
 let c=[];try{const r=await fetch('https://sites-thiep-20-11.jason.vn/api/gallery');c=(await r.json()).cards||[]}catch(err){}
 const mob=matchMedia('(max-width:760px)').matches,slots=mob?5:7;
 if(!c.length){document.getElementById('b').outerHTML='<main class="env" id="b"><div class="envl"><img src="../envelope.png" alt=""></div><h1>Tường thiệp 20/11</h1><p>Chưa có tấm thiệp nào, hãy gửi tấm thiệp đầu tiên nhé ♥&#xFE0E;</p></main>';return}
 if(!document.getElementById('b').classList.contains('board')){document.getElementById('b').outerHTML='<main class="board" id="b"></main>'}
 const real=c.slice(0,slots),fill=SAMPLE.slice(0,Math.max(0,slots-real.length));
 const note='<div class="note"><h1>Tường thiệp 20/11</h1><p>Bí ý tưởng viết thiệp thì qua đây tham khảo nha ♥&#xFE0E;</p></div>';
 const html=real.map((x,i)=>card(x,i,false)).concat(fill.map((x,i)=>card(x,i+real.length,true)));
 html.splice(mob?0:1,0,note);
 document.getElementById('b').innerHTML=html.join('');
}
load();setInterval(load,30000);addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(load,300)});
</script></body></html>
