<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><base href="/jason-teacher-day/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tường thiệp 20/11 · Cáo Ú</title>
<meta property="og:title" content="Tường thiệp 20/11, mọi người chúc nhau">
<meta property="og:image" content="https://jadeshare.space/jason-teacher-day/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&family=Charm:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2d4a73;--soft:#6b7f9e;--bl:#3a5fa0}
*{box-sizing:border-box}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#f7f2e5 url(paper.jpg);color:#2b3447;font-weight:500}
.back{position:fixed;top:14px;left:14px;z-index:9;width:40px;height:40px;border-radius:999px;border:1.5px solid #b9c6dc;background:#fffdf7;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px #2d4a7322}
header{text-align:center;padding:56px 16px 8px}
h1{font-family:'Charm',cursive;font-size:clamp(30px,6vw,52px);margin:0 0 8px;color:var(--ink);font-weight:700;line-height:1.1}
.sub{color:var(--soft);margin:0 auto 22px;max-width:560px;line-height:1.5;font-size:14.5px}
.cta{display:inline-block;background:var(--bl);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:13px 22px;font-size:15px}
.grid{columns:300px;column-gap:20px;max-width:1180px;margin:34px auto 60px;padding:0 20px}
.c{break-inside:avoid;display:block;text-decoration:none;color:inherit;margin:0 0 20px;border-radius:8px;padding:22px 20px 18px;box-shadow:0 10px 28px #2d4a7333,0 0 0 1px #0001;position:relative;transition:transform .2s}
.c:hover{transform:translateY(-4px) rotate(-.4deg)}
.c:before{content:"";position:absolute;inset:8px;border:1.5px solid currentColor;opacity:.35;border-radius:4px;pointer-events:none}
.c .h{font-family:'Charm',cursive;font-weight:700;font-size:19px;text-align:center;opacity:.85}
.c .to{font-family:'Charm',cursive;font-weight:700;font-size:30px;text-align:center;line-height:1.15;margin:2px 0 8px}
.c img{display:block;width:62%;margin:0 auto 12px;border-radius:50%;aspect-ratio:1;object-fit:cover;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 72%);mask-image:radial-gradient(circle,#000 58%,transparent 72%)}
.c p{font-family:'Charm',cursive;font-size:19px;line-height:1.4;text-align:center;margin:0 4px 10px}
.c .f{font-family:'Charm',cursive;font-weight:700;font-size:21px;text-align:right;margin-right:6px}
.empty{text-align:center;color:var(--soft);padding:60px 20px}
footer{text-align:center;color:var(--soft);font-size:12.5px;padding:0 16px 40px}
</style></head><body>
<a class="back" href="/jason-teacher-day/" aria-label="Quay lại tạo thiệp"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
<header><h1>Tường thiệp 20/11</h1>
<p class="sub">Những lời chúc mọi người gửi cho thầy cô, sếp, đồng nghiệp và người đã chỉ dạy mình. Chỉ hiện thiệp mà người gửi đồng ý đăng.</p>
<a class="cta" href="/jason-teacher-day/">Gửi một tấm thiệp ♥&#xFE0E;</a></header>
<main class="grid" id="g"></main>
<footer>Thiệp do Cáo Ú - Thử Việc làm · jason.vn</footer>
<script>
const FR=[{sw:'#f7f2e5',ink:'#2d4a73'},{sw:'#bcd0ee',ink:'#1f3f77'},{sw:'#f6cdb2',ink:'#7a4527'},{sw:'#27467f',ink:'#f4ecd8'}];
const ART=['butmay','caydai','denban','denbien','doday','lanban'];
const e=t=>String(t==null?'':t).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
async function load(){
 try{const r=await fetch('https://sites-thiep-20-11.jason.vn/api/gallery');const d=await r.json();const c=d.cards||[];
  document.getElementById('g').innerHTML=c.length?c.map(x=>{const f=FR[Math.min(3,Math.max(0,+x.k||0))],a=ART.includes(x.a)?x.a:'doday';
   return '<a class="c" href="/jason-teacher-day/?s='+e(x.id)+'" style="background:'+f.sw+';color:'+f.ink+'"><div class="h">Mừng Ngày Nhà Giáo Việt Nam 20/11</div><div class="to">'+e(x.t)+'</div><img src="art/'+a+'.jpg" alt="" loading="lazy"><p>'+e(x.m)+'</p>'+(x.f?'<div class="f">— '+e(x.f)+'</div>':'')+'</a>'}).join(''):'<div class="empty">Chưa có thiệp nào trên tường. Hãy gửi tấm thiệp đầu tiên nhé!</div>';
 }catch(err){}
}
load();setInterval(load,30000);
</script></body></html>
